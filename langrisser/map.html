<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>랑그릿사 모바일 맵 추첨</title>

<style>

/* =========================================================
   기본
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #263449 0%,
            #111720 42%,
            #090c11 100%
        );

    color: #eee;

    font-family:
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.wrap {
    width: min(1200px, 96vw);

    margin: 30px auto 50px;

    text-align: center;
}


/* =========================================================
   대문 이미지
========================================================= */

.hero {
    position: relative;

    width: 100%;
    max-width: 1200px;

    margin: 0 auto 30px;

    overflow: hidden;

    border: 1px solid rgba(229, 198, 122, .35);
    border-radius: 10px;

    background: #111720;

    box-shadow:
        0 12px 35px rgba(0, 0, 0, .4);
}

.hero img {
    display: block;

    width: 100%;
    height: auto;

    user-select: none;
    -webkit-user-drag: none;
}


/* =========================================================
   대문 오버레이 타이틀

   이미지 기준 약 7시 방향
========================================================= */

.hero-title {
    position: absolute;

    left: 5%;
    bottom: 10%;

    z-index: 2;

    padding: 10px 22px 11px;

    color: #f4d77d;

    font-size: 26px;
    font-weight: 800;

    letter-spacing: 2px;

    white-space: nowrap;

    background:
        linear-gradient(
            90deg,
            rgba(8, 12, 18, .94) 0%,
            rgba(15, 21, 30, .84) 72%,
            rgba(15, 21, 30, .20) 100%
        );

    border-left:
        4px solid #e6c568;

    text-shadow:
        0 2px 5px rgba(0, 0, 0, .9);

    box-shadow:
        0 5px 18px rgba(0, 0, 0, .35);

    backdrop-filter:
        blur(2px);

    -webkit-backdrop-filter:
        blur(2px);
}


/* =========================================================
   룰렛 영역
========================================================= */

.roulette-wrap {
    position: relative;

    width: 100%;

    overflow: hidden;

    padding: 30px 0;

    border-top:
        1px solid #806c3d;

    border-bottom:
        1px solid #806c3d;

    background:
        rgba(0, 0, 0, .32);

    box-shadow:
        inset 0 0 40px rgba(0, 0, 0, .7),
        0 10px 40px rgba(0, 0, 0, .25);
}


/* =========================================================
   좌우 페이드
========================================================= */

.roulette-wrap::before,
.roulette-wrap::after {
    content: "";

    position: absolute;

    z-index: 5;

    top: 0;

    width: 12%;
    height: 100%;

    pointer-events: none;
}

.roulette-wrap::before {
    left: 0;

    background:
        linear-gradient(
            90deg,
            #090c11 0%,
            rgba(9, 12, 17, .85) 25%,
            transparent 100%
        );
}

.roulette-wrap::after {
    right: 0;

    background:
        linear-gradient(
            -90deg,
            #090c11 0%,
            rgba(9, 12, 17, .85) 25%,
            transparent 100%
        );
}


/* =========================================================
   룰렛 트랙
========================================================= */

.roulette-track {
    display: flex;

    gap: 18px;

    width: max-content;

    transform:
        translateX(0);

    will-change:
        transform;
}


/* =========================================================
   맵 카드

   이미지 원본 비율 : 550 × 290

   이미지 자체에 맵 이름이 있기 때문에
   별도의 이름 영역은 사용하지 않음
========================================================= */

.map-card {
    position: relative;

    flex: 0 0 550px;

    width: 550px;
    height: 290px;

    overflow: hidden;

    background:
        #171d25;

    border:
        2px solid #414957;

    border-radius:
        8px;

    box-shadow:
        0 6px 18px rgba(0, 0, 0, .4);

    transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s,
        opacity .25s;
}

.map-card img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit:
        cover;

    user-select:
        none;

    -webkit-user-drag:
        none;
}


/* =========================================================
   당첨 카드
========================================================= */

.map-card.winner {
    z-index: 2;

    border-color:
        #f1d278;

    box-shadow:
        0 0 12px rgba(241, 210, 120, .85),
        0 0 35px rgba(241, 210, 120, .45);

    transform:
        scale(1.025);
}


/* =========================================================
   중앙 선택 영역
========================================================= */

.selector {
    position: absolute;

    z-index: 10;

    left: 50%;

    top: 20px;
    bottom: 20px;

    width: 554px;

    transform:
        translateX(-50%);

    border-left:
        2px solid #e7c467;

    border-right:
        2px solid #e7c467;

    pointer-events:
        none;
}

.selector::before,
.selector::after {
    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);

    color:
        #ffd875;

    font-size:
        25px;

    line-height:
        1;

    text-shadow:
        0 0 8px #e3af38;
}

.selector::before {
    content: "▼";

    top: -22px;
}

.selector::after {
    content: "▲";

    bottom: -22px;
}


/* =========================================================
   결과
========================================================= */

.result {
    min-height: 60px;

    margin-top: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-wrap: wrap;

    font-size: 21px;
    font-weight: 700;
}

.result .selected {
    margin-left: 8px;

    color:
        #f1ce70;

    font-size:
        25px;
}

.remaining {
    margin-left: 12px;

    color:
        #737d8a;

    font-size:
        13px;
}


/* =========================================================
   버튼
========================================================= */

.controls {
    display: flex;

    justify-content: center;
    align-items: center;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 15px;
}

button {
    padding:
        12px 22px;

    border:
        1px solid #92783d;

    border-radius:
        5px;

    background:
        linear-gradient(
            #3d3422,
            #211c13
        );

    color:
        #f1d78d;

    font-size:
        15px;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        background .2s,
        border-color .2s,
        transform .2s,
        opacity .2s;
}

button:hover:not(:disabled) {
    border-color:
        #e6c66c;

    background:
        linear-gradient(
            #504326,
            #2b2415
        );

    transform:
        translateY(-1px);
}

button:active:not(:disabled) {
    transform:
        translateY(0);
}

button:disabled {
    opacity:
        .45;

    cursor:
        default;
}

.draw-btn {
    min-width:
        180px;

    padding:
        14px 30px;

    font-size:
        18px;
}


/* =========================================================
   자동 제외 옵션
========================================================= */

.option {
    margin-top:
        22px;

    color:
        #bfc5ce;

    font-size:
        14px;
}

.option label {
    cursor:
        pointer;
}

.option input {
    vertical-align:
        -1px;
}


/* =========================================================
   제외된 맵
========================================================= */

.excluded-box {
    max-width:
        900px;

    margin:
        35px auto 0;

    padding-top:
        20px;

    border-top:
        1px solid #303744;
}

.excluded-title {
    margin-bottom:
        12px;

    color:
        #828b98;

    font-size:
        14px;
}

.excluded-list {
    min-height:
        32px;

    display:
        flex;

    justify-content:
        center;

    flex-wrap:
        wrap;

    gap:
        7px;
}

.excluded-item {
    padding:
        6px 10px;

    border:
        1px solid #3d4551;

    border-radius:
        4px;

    background:
        #151a21;

    color:
        #89919c;

    font-size:
        12px;
}

.empty {
    color:
        #59616d;

    font-size:
        13px;
}


/* =========================================================
   태블릿 / 모바일
========================================================= */

@media (max-width: 700px) {

    .wrap {
        width:
            96vw;

        margin-top:
            18px;
    }


    /* 대문 */

    .hero {
        margin-bottom:
            22px;

        border-radius:
            7px;
    }


    /* 대문 오버레이 제목 */

    .hero-title {
        left:
            4%;

        bottom:
            8%;

        padding:
            7px 14px 8px;

        border-left-width:
            3px;

        font-size:
            18px;

        letter-spacing:
            1px;
    }


    /* 룰렛 */

    .roulette-wrap {
        padding:
            25px 0;
    }


    /*
       모바일에서도
       550 : 290 비율 유지
    */

    .map-card {
        flex-basis:
            82vw;

        width:
            82vw;

        height:
            auto;

        aspect-ratio:
            550 / 290;
    }

    .map-card img {
        width:
            100%;

        height:
            100%;
    }


    /* 중앙 선택 영역 */

    .selector {
        top:
            15px;

        bottom:
            15px;

        width:
            calc(82vw + 4px);
    }


    /* 결과 */

    .result {
        margin-top:
            18px;

        font-size:
            17px;
    }

    .result .selected {
        font-size:
            21px;
    }

}


/* =========================================================
   작은 모바일
========================================================= */

@media (max-width: 420px) {

    /* 대문 제목 */

    .hero-title {
        left:
            4%;

        bottom:
            7%;

        padding:
            6px 11px;

        font-size:
            15px;

        letter-spacing:
            .7px;
    }


    /* 룰렛 */

    .map-card {
        flex-basis:
            86vw;

        width:
            86vw;
    }

    .selector {
        width:
            calc(86vw + 4px);
    }


    /* 버튼 */

    .controls {
        gap:
            8px;
    }

    .draw-btn {
        min-width:
            160px;

        font-size:
            16px;
    }

    button {
        padding:
            11px 15px;

        font-size:
            13px;
    }


    /* 결과 */

    .result {
        font-size:
            16px;
    }

    .result .selected {
        font-size:
            20px;
    }

}

</style>
</head>


<body>

<div class="wrap">


    <!-- =====================================================
         대문 이미지
    ====================================================== -->

    <div class="hero">

        <img
            src="https://anotherkyo.github.io/img/map.png"
            alt="랑그릿사 모바일 맵 추첨"
            draggable="false"
        >


        <!--
            이미지 기준 약 7시 방향에
            겹쳐서 표시되는 타이틀
        -->

        <div class="hero-title">
            Langrisser Map Select
        </div>

    </div>


    <!-- =====================================================
         룰렛
    ====================================================== -->

    <div
        class="roulette-wrap"
        id="rouletteWrap"
    >

        <div class="selector"></div>

        <div
            class="roulette-track"
            id="rouletteTrack"
        ></div>

    </div>


    <!-- =====================================================
         결과
    ====================================================== -->

    <div
        class="result"
        id="result"
    >
        맵 추첨을 시작해주세요.
    </div>


    <!-- =====================================================
         버튼
    ====================================================== -->

    <div class="controls">

        <button
            class="draw-btn"
            id="drawBtn"
        >
            🎲 맵 추첨
        </button>

        <button
            id="resetBtn"
        >
            제외 맵 초기화
        </button>

    </div>


    <!-- =====================================================
         자동 제외 옵션
    ====================================================== -->

    <div class="option">

        <label>

            <input
                type="checkbox"
                id="excludeOption"
                checked
            >

            추첨된 맵은 다음 추첨에서 제외

        </label>

    </div>


    <!-- =====================================================
         제외 목록
    ====================================================== -->

    <div class="excluded-box">

        <div class="excluded-title">
            제외된 맵
        </div>

        <div
            class="excluded-list"
            id="excludedList"
        ></div>

    </div>


</div>


<script>

/* =========================================================
   맵 데이터

   맵 이름은 카드 아래에는 표시하지 않음.

   하지만
   - 추첨 결과
   - 제외 목록
   - 이미지 alt

   에서 사용하므로 name 값은 유지.
========================================================= */

const maps = [

    {
        id: "map01",
        name: "서풍초소",
        image: "./img/map/01.png"
    },

    {
        id: "map02",
        name: "사막의 눈",
        image: "./img/map/02.png"
    },

    {
        id: "map03",
        name: "하늘정원",
        image: "./img/map/03.png"
    },

    {
        id: "map04",
        name: "트윈 브릿지의 파도",
        image: "./img/map/04.png"
    },

    {
        id: "map05",
        name: "눈 덮인 벌판",
        image: "./img/map/05.png"
    },

    {
        id: "map06",
        name: "깎아지른 절벽",
        image: "./img/map/06.png"
    },

    {
        id: "map07",
        name: "비경의 계류",
        image: "./img/map/07.png"
    },

    {
        id: "map08",
        name: "망가진 함선의 길목",
        image: "./img/map/08.png"
    },

    {
        id: "map09",
        name: "유황이 녹는 땅",
        image: "./img/map/09.png"
    },

    {
        id: "map10",
        name: "순환 언덕",
        image: "./img/map/10.png"
    },

    {
        id: "map11",
        name: "부유 비경",
        image: "./img/map/11.png"
    },

    {
        id: "map12",
        name: "폐허 유적",
        image: "./img/map/12.png"
    }

];


/* =========================================================
   DOM
========================================================= */

const track =
    document.getElementById(
        "rouletteTrack"
    );

const rouletteWrap =
    document.getElementById(
        "rouletteWrap"
    );

const drawBtn =
    document.getElementById(
        "drawBtn"
    );

const resetBtn =
    document.getElementById(
        "resetBtn"
    );

const result =
    document.getElementById(
        "result"
    );

const excludedList =
    document.getElementById(
        "excludedList"
    );

const excludeOption =
    document.getElementById(
        "excludeOption"
    );


/* =========================================================
   상태
========================================================= */

let excludedMaps = [];

let drawing = false;


/* =========================================================
   기본 랜덤
========================================================= */

function randomItem(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* =========================================================
   특정 맵 제외 랜덤

   excludeIds에 포함된 맵을 제외한 뒤
   랜덤 선택.

   룰렛에서 동일한 맵이 바로 연속해서
   표시되지 않도록 사용.
========================================================= */

function randomItemExcept(
    array,
    excludeIds = []
) {

    const candidates =
        array.filter(
            map =>
                !excludeIds.includes(
                    map.id
                )
        );


    if (
        candidates.length > 0
    ) {

        return randomItem(
            candidates
        );

    }


    /*
       혹시 후보가 하나도 없다면
       원본 배열에서 선택
    */

    return randomItem(
        array
    );

}


/* =========================================================
   맵 카드 생성

   이미지 자체에 맵 이름이 있으므로
   별도의 하단 이름 영역은 생성하지 않음.
========================================================= */

function createCard(map) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "map-card";


    card.innerHTML = `

        <img
            src="${map.image}"
            alt="${map.name}"
            draggable="false"
        >

    `;


    return card;

}


/* =========================================================
   실제 추첨 가능한 맵
========================================================= */

function getAvailableMaps() {

    return maps.filter(
        map =>
            !excludedMaps.includes(
                map.id
            )
    );

}


/* =========================================================
   특정 카드를 화면 중앙으로 이동
========================================================= */

function centerCard(card) {

    if (!card) {
        return;
    }


    const cardCenter =
        card.offsetLeft +
        card.offsetWidth / 2;


    const containerCenter =
        rouletteWrap.clientWidth /
        2;


    const target =
        containerCenter -
        cardCenter;


    track.style.transform =
        `translateX(${target}px)`;

}


/* =========================================================
   초기 맵 미리보기

   아직 제외되지 않은 맵들을 표시.
========================================================= */

function showInitialMaps() {

    const availableMaps =
        getAvailableMaps();


    track.innerHTML =
        "";


    track.style.transition =
        "none";


    /*
       현재 추첨 가능한 맵 표시
    */

    availableMaps.forEach(
        map => {

            const card =
                createCard(
                    map
                );


            track.appendChild(
                card
            );

        }
    );


    /*
       남은 맵 없음
    */

    if (
        availableMaps.length === 0
    ) {

        track.style.transform =
            "translateX(0px)";

        return;

    }


    /*
       목록의 중앙 정도에 있는 카드를
       화면 중앙으로 위치시킴
    */

    requestAnimationFrame(
        () => {

            const cards =
                track.querySelectorAll(
                    ".map-card"
                );


            if (
                cards.length === 0
            ) {

                return;

            }


            const previewIndex =
                Math.floor(
                    cards.length /
                    2
                );


            centerCard(
                cards[
                    previewIndex
                ]
            );

        }
    );

}


/* =========================================================
   룰렛 연출 배열 생성

   중요:

   실제 당첨 후보
       = 아직 제외되지 않은 맵

   화면에 지나가는 연출용 맵
       = 전체 맵

   서로 분리해서 사용.

   따라서 마지막 한 개의 맵만 남더라도
   좌우에 다른 맵을 보여줄 수 있음.
========================================================= */

function createRouletteSequence(
    winner
) {

    const rouletteMaps =
        [];


    /* =====================================================
       당첨 전 카드 30개
    ===================================================== */

    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const previous =
            rouletteMaps.length > 0
                ? rouletteMaps[
                    rouletteMaps.length - 1
                ]
                : null;


        /*
           직전 카드와 같은 맵 제외
        */

        const excludeIds =
            previous
                ? [
                    previous.id
                ]
                : [];


        const map =
            randomItemExcept(
                maps,
                excludeIds
            );


        rouletteMaps.push(
            map
        );

    }


    /* =====================================================
       당첨 바로 왼쪽 카드 검사

       반드시

       왼쪽 맵 ≠ 당첨 맵
    ===================================================== */

    if (
        rouletteMaps.length > 0
    ) {

        const leftIndex =
            rouletteMaps.length -
            1;


        const leftMap =
            rouletteMaps[
                leftIndex
            ];


        if (
            leftMap.id ===
            winner.id
        ) {

            /*
               왼쪽의 왼쪽 카드
            */

            const beforeLeft =
                leftIndex > 0
                    ? rouletteMaps[
                        leftIndex - 1
                    ]
                    : null;


            /*
               당첨 맵은 무조건 제외
            */

            const excludeIds =
                [
                    winner.id
                ];


            /*
               왼쪽의 왼쪽 맵과도
               중복되지 않도록 처리
            */

            if (
                beforeLeft
            ) {

                excludeIds.push(
                    beforeLeft.id
                );

            }


            rouletteMaps[
                leftIndex
            ] =
                randomItemExcept(
                    maps,
                    excludeIds
                );

        }

    }


    /* =====================================================
       실제 당첨 카드
    ===================================================== */

    const winnerIndex =
        rouletteMaps.length;


    rouletteMaps.push(
        winner
    );


    /* =====================================================
       당첨 이후 카드 4개

       직전 카드와 같은 맵이 나오지 않음.

       첫 번째 반복에서는 직전 카드가 winner이므로
       당첨 바로 오른쪽도 winner와 다름.
    ===================================================== */

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const previous =
            rouletteMaps[
                rouletteMaps.length -
                1
            ];


        const map =
            randomItemExcept(
                maps,
                [
                    previous.id
                ]
            );


        rouletteMaps.push(
            map
        );

    }


    return {

        maps:
            rouletteMaps,

        winnerIndex:
            winnerIndex

    };

}


/* =========================================================
   맵 추첨
========================================================= */

function drawMap() {

    /*
       추첨 중 중복 클릭 방지
    */

    if (
        drawing
    ) {

        return;

    }


    /* =====================================================
       실제 추첨 가능한 맵
    ===================================================== */

    const availableMaps =
        getAvailableMaps();


    /* =====================================================
       모든 맵을 이미 추첨한 경우
    ===================================================== */

    if (
        availableMaps.length === 0
    ) {

        result.innerHTML =
            "모든 맵이 추첨되었습니다. 제외 맵을 초기화해주세요.";

        return;

    }


    /* =====================================================
       추첨 시작
    ===================================================== */

    drawing =
        true;


    drawBtn.disabled =
        true;


    resetBtn.disabled =
        true;


    result.innerHTML =
        "맵 추첨 중...";


    /* =====================================================
       실제 당첨 맵

       반드시 availableMaps 안에서만 선택.

       즉 이미 제외된 맵은
       다시 당첨되지 않음.
    ===================================================== */

    const winner =
        randomItem(
            availableMaps
        );


    /* =====================================================
       룰렛 연출 배열
    ===================================================== */

    const roulette =
        createRouletteSequence(
            winner
        );


    const rouletteMaps =
        roulette.maps;


    const winnerIndex =
        roulette.winnerIndex;


    /* =====================================================
       기존 룰렛 초기화
    ===================================================== */

    track.innerHTML =
        "";


    track.style.transition =
        "none";


    track.style.transform =
        "translateX(0px)";


    /* =====================================================
       룰렛 카드 생성
    ===================================================== */

    rouletteMaps.forEach(
        (map, index) => {

            const card =
                createCard(
                    map
                );


            /*
               실제 당첨 카드에만
               data-winner 설정
            */

            if (
                index ===
                winnerIndex
            ) {

                card.dataset.winner =
                    "true";

            }


            track.appendChild(
                card
            );

        }
    );


    /* =====================================================
       룰렛 이동 애니메이션
    ===================================================== */

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {


                    const cards =
                        track.querySelectorAll(
                            ".map-card"
                        );


                    const winnerCard =
                        cards[
                            winnerIndex
                        ];


                    /*
                       당첨 카드 중앙 좌표
                    */

                    const cardCenter =
                        winnerCard.offsetLeft +
                        winnerCard.offsetWidth /
                        2;


                    /*
                       룰렛 화면 중앙
                    */

                    const containerCenter =
                        rouletteWrap.clientWidth /
                        2;


                    /*
                       시작 위치에 약간의 랜덤값
                    */

                    const startOffset =
                        Math.random() *
                        100;


                    track.style.transform =
                        `translateX(${startOffset}px)`;


                    requestAnimationFrame(
                        () => {


                            /*
                               약 2.7초 동안 감속
                            */

                            track.style.transition =
                                "transform 2.7s cubic-bezier(0.12, 0.72, 0.12, 1)";


                            /*
                               당첨 카드를 정확히
                               중앙 선택 영역에 위치
                            */

                            const target =
                                containerCenter -
                                cardCenter;


                            track.style.transform =
                                `translateX(${target}px)`;

                        }
                    );

                }
            );

        }
    );


    /* =====================================================
       추첨 종료
    ===================================================== */

    setTimeout(
        () => {


            const winnerCard =
                track.querySelector(
                    '[data-winner="true"]'
                );


            /* =================================================
               당첨 카드 강조
            ================================================= */

            if (
                winnerCard
            ) {

                winnerCard.classList.add(
                    "winner"
                );

            }


            /* =================================================
               결과 표시
            ================================================= */

            result.innerHTML = `

                선택된 맵

                <span class="selected">
                    ${winner.name}
                </span>

            `;


            /* =================================================
               자동 제외
            ================================================= */

            if (
                excludeOption.checked
            ) {


                if (
                    !excludedMaps.includes(
                        winner.id
                    )
                ) {

                    excludedMaps.push(
                        winner.id
                    );

                }


                updateExcludedList();

            }


            /* =================================================
               추첨 종료 상태
            ================================================= */

            drawing =
                false;


            drawBtn.disabled =
                false;


            resetBtn.disabled =
                false;


            /* =================================================
               남은 맵 수
            ================================================= */

            const remaining =
                maps.length -
                excludedMaps.length;


            if (
                excludeOption.checked
            ) {


                if (
                    remaining > 0
                ) {

                    result.innerHTML += `

                        <span class="remaining">
                            남은 맵 ${remaining}개
                        </span>

                    `;

                }

                else {

                    result.innerHTML += `

                        <span class="remaining">
                            모든 맵 추첨 완료
                        </span>

                    `;

                }

            }


        },
        2800
    );

}


/* =========================================================
   제외된 맵 목록 갱신
========================================================= */

function updateExcludedList() {

    excludedList.innerHTML =
        "";


    /* =====================================================
       제외된 맵 없음
    ===================================================== */

    if (
        excludedMaps.length === 0
    ) {

        excludedList.innerHTML = `

            <span class="empty">
                제외된 맵이 없습니다.
            </span>

        `;


        return;

    }


    /* =====================================================
       제외된 맵 출력
    ===================================================== */

    excludedMaps.forEach(
        id => {


            const map =
                maps.find(
                    map =>
                        map.id === id
                );


            if (
                !map
            ) {

                return;

            }


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "excluded-item";


            item.textContent =
                map.name;


            excludedList.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   제외 맵 초기화
========================================================= */

function resetExcluded() {

    /*
       룰렛 동작 중에는 초기화 금지
    */

    if (
        drawing
    ) {

        return;

    }


    /*
       제외 목록 초기화
    */

    excludedMaps =
        [];


    updateExcludedList();


    /*
       전체 맵 미리보기 복원
    */

    showInitialMaps();


    result.innerHTML =
        "제외된 맵이 초기화되었습니다.";

}


/* =========================================================
   화면 크기 변경 대응
========================================================= */

let resizeTimer;


window.addEventListener(
    "resize",
    () => {


        /*
           추첨 도중에는
           위치를 다시 계산하지 않음
        */

        if (
            drawing
        ) {

            return;

        }


        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                showInitialMaps,
                150
            );

    }
);


/* =========================================================
   이벤트
========================================================= */

drawBtn.addEventListener(
    "click",
    drawMap
);


resetBtn.addEventListener(
    "click",
    resetExcluded
);


/* =========================================================
   최초 실행
========================================================= */

updateExcludedList();

showInitialMaps();

</script>

</body>
</html>
