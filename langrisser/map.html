<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>랑그릿사 모바일 맵 추첨</title>

<style>

/* =========================================================
   기본
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #263449 0%,
            #111720 42%,
            #090c11 100%
        );

    color: #eee;

    font-family:
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;
}


/* =========================================================
   전체 레이아웃

   기존보다 상/하 여백을 줄여
   한 화면에 최대한 많은 내용을 표시
========================================================= */

.wrap {
    width: min(1200px, 96vw);

    margin: 18px auto 28px;

    text-align: center;
}


/* =========================================================
   대문 이미지

   원본 비율 전체를 표시하지 않고
   기록실처럼 배너 형태로 높이를 제한
========================================================= */

.hero {
    position: relative;

    width: 100%;

    height:
        clamp(
            240px,
            23vh,
            360px
        );

    margin: 0 auto 18px;

    overflow: hidden;

    border:
        1px solid rgba(229, 198, 122, .35);

    border-radius: 10px;

    background:
        #111720;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, .35);
}


/* =========================================================
   대문 이미지

   height: auto 사용하지 않음.

   정해진 hero 영역에 맞춰
   이미지를 잘라서 표시
========================================================= */

.hero img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    /*
       이미지에서 보여주고 싶은
       세로 중심 위치.

       필요하면 35%, 50% 등으로
       조정하면 됨.
    */
    object-position:
        center 42%;

    user-select:
        none;

    -webkit-user-drag:
        none;
}


/* =========================================================
   대문 타이틀

   이미지 기준 약 7시 방향
========================================================= */

.hero-title {
    position: absolute;

    z-index: 2;

    left: 5%;
    bottom: 10%;

    padding:
        10px 22px 11px;

    color:
        #f4d77d;

    font-size:
        26px;

    font-weight:
        800;

    letter-spacing:
        2px;

    white-space:
        nowrap;

    background:
        linear-gradient(
            90deg,
            rgba(8, 12, 18, .94) 0%,
            rgba(15, 21, 30, .84) 72%,
            rgba(15, 21, 30, .20) 100%
        );

    border-left:
        4px solid #e6c568;

    text-shadow:
        0 2px 5px rgba(0, 0, 0, .9);

    box-shadow:
        0 5px 18px rgba(0, 0, 0, .35);

    backdrop-filter:
        blur(2px);

    -webkit-backdrop-filter:
        blur(2px);
}


/* =========================================================
   룰렛 영역

   기존 30px → 22px
========================================================= */

.roulette-wrap {
    position: relative;

    width: 100%;

    overflow: hidden;

    padding:
        22px 0;

    border-top:
        1px solid #806c3d;

    border-bottom:
        1px solid #806c3d;

    background:
        rgba(0, 0, 0, .32);

    box-shadow:
        inset 0 0 40px rgba(0, 0, 0, .7),
        0 8px 30px rgba(0, 0, 0, .25);
}


/* =========================================================
   룰렛 좌우 페이드
========================================================= */

.roulette-wrap::before,
.roulette-wrap::after {
    content: "";

    position: absolute;

    z-index: 5;

    top: 0;

    width: 12%;
    height: 100%;

    pointer-events: none;
}

.roulette-wrap::before {
    left: 0;

    background:
        linear-gradient(
            90deg,
            #090c11 0%,
            rgba(9, 12, 17, .85) 25%,
            transparent 100%
        );
}

.roulette-wrap::after {
    right: 0;

    background:
        linear-gradient(
            -90deg,
            #090c11 0%,
            rgba(9, 12, 17, .85) 25%,
            transparent 100%
        );
}


/* =========================================================
   룰렛 트랙
========================================================= */

.roulette-track {
    display: flex;

    gap:
        18px;

    width:
        max-content;

    transform:
        translateX(0);

    will-change:
        transform;
}


/* =========================================================
   맵 카드

   이미지 자체에 맵 이름이 있으므로
   별도의 이름 표시 영역 없음.

   원본 기준 550 × 290
========================================================= */

.map-card {
    position: relative;

    flex:
        0 0 550px;

    width:
        550px;

    height:
        290px;

    overflow:
        hidden;

    background:
        #171d25;

    border:
        2px solid #414957;

    border-radius:
        8px;

    box-shadow:
        0 6px 18px rgba(0, 0, 0, .4);

    transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s,
        opacity .25s;
}

.map-card img {
    display: block;

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;

    user-select:
        none;

    -webkit-user-drag:
        none;
}


/* =========================================================
   당첨 카드
========================================================= */

.map-card.winner {
    z-index: 2;

    border-color:
        #f1d278;

    box-shadow:
        0 0 12px rgba(241, 210, 120, .85),
        0 0 35px rgba(241, 210, 120, .45);

    transform:
        scale(1.025);
}


/* =========================================================
   중앙 선택 영역
========================================================= */

.selector {
    position: absolute;

    z-index: 10;

    left: 50%;

    top:
        12px;

    bottom:
        12px;

    width:
        554px;

    transform:
        translateX(-50%);

    border-left:
        2px solid #e7c467;

    border-right:
        2px solid #e7c467;

    pointer-events:
        none;
}

.selector::before,
.selector::after {
    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);

    color:
        #ffd875;

    font-size:
        24px;

    line-height:
        1;

    text-shadow:
        0 0 8px #e3af38;
}

.selector::before {
    content: "▼";

    top:
        -18px;
}

.selector::after {
    content: "▲";

    bottom:
        -18px;
}


/* =========================================================
   추첨 결과

   기존보다 높이/여백 축소
========================================================= */

.result {
    min-height:
        50px;

    margin-top:
        14px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    flex-wrap:
        wrap;

    font-size:
        20px;

    font-weight:
        700;
}

.result .selected {
    margin-left:
        8px;

    color:
        #f1ce70;

    font-size:
        24px;
}

.remaining {
    margin-left:
        12px;

    color:
        #737d8a;

    font-size:
        13px;
}


/* =========================================================
   버튼 영역

   세로 여백 축소
========================================================= */

.controls {
    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    flex-wrap:
        wrap;

    gap:
        10px;

    margin-top:
        8px;
}

button {
    padding:
        11px 22px;

    border:
        1px solid #92783d;

    border-radius:
        5px;

    background:
        linear-gradient(
            #3d3422,
            #211c13
        );

    color:
        #f1d78d;

    font-size:
        15px;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        background .2s,
        border-color .2s,
        transform .2s,
        opacity .2s;
}

button:hover:not(:disabled) {
    border-color:
        #e6c66c;

    background:
        linear-gradient(
            #504326,
            #2b2415
        );

    transform:
        translateY(-1px);
}

button:active:not(:disabled) {
    transform:
        translateY(0);
}

button:disabled {
    opacity:
        .45;

    cursor:
        default;
}

.draw-btn {
    min-width:
        180px;

    padding:
        12px 30px;

    font-size:
        17px;
}


/* =========================================================
   자동 제외 옵션

   기존 22px → 14px
========================================================= */

.option {
    margin-top:
        14px;

    color:
        #bfc5ce;

    font-size:
        14px;
}

.option label {
    cursor:
        pointer;
}

.option input {
    vertical-align:
        -1px;
}


/* =========================================================
   제외된 맵

   기존
       margin-top 35
       padding-top 20

   변경
       margin-top 22
       padding-top 14
========================================================= */

.excluded-box {
    max-width:
        900px;

    margin:
        22px auto 0;

    padding-top:
        14px;

    border-top:
        1px solid #303744;
}

.excluded-title {
    margin-bottom:
        10px;

    color:
        #828b98;

    font-size:
        14px;
}

.excluded-list {
    min-height:
        30px;

    display:
        flex;

    justify-content:
        center;

    flex-wrap:
        wrap;

    gap:
        7px;
}

.excluded-item {
    padding:
        5px 10px;

    border:
        1px solid #3d4551;

    border-radius:
        4px;

    background:
        #151a21;

    color:
        #89919c;

    font-size:
        12px;
}

.empty {
    color:
        #59616d;

    font-size:
        13px;
}


/* =========================================================
   중간 높이 모니터

   1080p 등에서는 대문을 조금 더 축소
========================================================= */

@media (max-height: 1100px) and (min-width: 701px) {

    .hero {
        height:
            clamp(
                210px,
                22vh,
                260px
            );

        margin-bottom:
            14px;
    }

    .wrap {
        margin-top:
            12px;
    }

    .roulette-wrap {
        padding:
            18px 0;
    }

    .result {
        min-height:
            44px;

        margin-top:
            10px;
    }

    .option {
        margin-top:
            10px;
    }

    .excluded-box {
        margin-top:
            16px;

        padding-top:
            10px;
    }

}


/* =========================================================
   태블릿 / 모바일
========================================================= */

@media (max-width: 700px) {

    .wrap {
        width:
            96vw;

        margin:
            14px auto 25px;
    }


    /* =====================================================
       대문
    ===================================================== */

    .hero {
        height:
            clamp(
                170px,
                28vw,
                230px
            );

        margin-bottom:
            16px;

        border-radius:
            7px;
    }

    .hero-title {
        left:
            4%;

        bottom:
            8%;

        padding:
            7px 14px 8px;

        border-left-width:
            3px;

        font-size:
            18px;

        letter-spacing:
            1px;
    }


    /* =====================================================
       룰렛
    ===================================================== */

    .roulette-wrap {
        padding:
            20px 0;
    }


    /*
       550 : 290 비율 유지
    */

    .map-card {
        flex-basis:
            82vw;

        width:
            82vw;

        height:
            auto;

        aspect-ratio:
            550 / 290;
    }

    .map-card img {
        width:
            100%;

        height:
            100%;
    }


    /* =====================================================
       선택선
    ===================================================== */

    .selector {
        top:
            10px;

        bottom:
            10px;

        width:
            calc(82vw + 4px);
    }


    /* =====================================================
       결과
    ===================================================== */

    .result {
        min-height:
            45px;

        margin-top:
            12px;

        font-size:
            17px;
    }

    .result .selected {
        font-size:
            21px;
    }


    /* =====================================================
       제외영역
    ===================================================== */

    .excluded-box {
        margin-top:
            18px;
    }

}


/* =========================================================
   작은 모바일
========================================================= */

@media (max-width: 420px) {

    .hero {
        height:
            160px;
    }

    .hero-title {
        left:
            4%;

        bottom:
            7%;

        padding:
            6px 11px;

        font-size:
            15px;

        letter-spacing:
            .7px;
    }


    .map-card {
        flex-basis:
            86vw;

        width:
            86vw;
    }

    .selector {
        width:
            calc(86vw + 4px);
    }


    .controls {
        gap:
            8px;
    }

    .draw-btn {
        min-width:
            155px;

        font-size:
            15px;
    }

    button {
        padding:
            10px 14px;

        font-size:
            13px;
    }


    .result {
        font-size:
            15px;
    }

    .result .selected {
        font-size:
            19px;
    }

}

</style>
</head>


<body>

<div class="wrap">


    <!-- =====================================================
         대문
    ====================================================== -->

    <div class="hero">

        <img
            src="https://anotherkyo.github.io/img/map.png"
            alt="랑그릿사 모바일 맵 추첨"
            draggable="false"
        >

        <div class="hero-title">
            Langrisser Mobile Map Random Select
        </div>

    </div>


    <!-- =====================================================
         룰렛
    ====================================================== -->

    <div
        class="roulette-wrap"
        id="rouletteWrap"
    >

        <div class="selector"></div>

        <div
            class="roulette-track"
            id="rouletteTrack"
        ></div>

    </div>


    <!-- =====================================================
         결과
    ====================================================== -->

    <div
        class="result"
        id="result"
    >
        맵 추첨을 시작해주세요.
    </div>


    <!-- =====================================================
         버튼
    ====================================================== -->

    <div class="controls">

        <button
            class="draw-btn"
            id="drawBtn"
        >
            🎲 맵 추첨
        </button>

        <button
            id="resetBtn"
        >
            제외 맵 초기화
        </button>

    </div>


    <!-- =====================================================
         자동 제외 옵션
    ====================================================== -->

    <div class="option">

        <label>

            <input
                type="checkbox"
                id="excludeOption"
                checked
            >

            추첨된 맵은 다음 추첨에서 제외

        </label>

    </div>


    <!-- =====================================================
         제외 목록
    ====================================================== -->

    <div class="excluded-box">

        <div class="excluded-title">
            제외된 맵
        </div>

        <div
            class="excluded-list"
            id="excludedList"
        ></div>

    </div>

</div>


<script>

/* =========================================================
   맵 데이터
========================================================= */

const maps = [

    {
        id: "map01",
        name: "서풍초소",
        image: "./img/map/01.png"
    },

    {
        id: "map02",
        name: "사막의 눈",
        image: "./img/map/02.png"
    },

    {
        id: "map03",
        name: "하늘정원",
        image: "./img/map/03.png"
    },

    {
        id: "map04",
        name: "트윈 브릿지의 파도",
        image: "./img/map/04.png"
    },

    {
        id: "map05",
        name: "눈 덮인 벌판",
        image: "./img/map/05.png"
    },

    {
        id: "map06",
        name: "깎아지른 절벽",
        image: "./img/map/06.png"
    },

    {
        id: "map07",
        name: "비경의 계류",
        image: "./img/map/07.png"
    },

    {
        id: "map08",
        name: "망가진 함선의 길목",
        image: "./img/map/08.png"
    },

    {
        id: "map09",
        name: "유황이 녹는 땅",
        image: "./img/map/09.png"
    },

    {
        id: "map10",
        name: "순환 언덕",
        image: "./img/map/10.png"
    },

    {
        id: "map11",
        name: "부유 비경",
        image: "./img/map/11.png"
    },

    {
        id: "map12",
        name: "폐허 유적",
        image: "./img/map/12.png"
    }

];


/* =========================================================
   DOM
========================================================= */

const track =
    document.getElementById(
        "rouletteTrack"
    );

const rouletteWrap =
    document.getElementById(
        "rouletteWrap"
    );

const drawBtn =
    document.getElementById(
        "drawBtn"
    );

const resetBtn =
    document.getElementById(
        "resetBtn"
    );

const result =
    document.getElementById(
        "result"
    );

const excludedList =
    document.getElementById(
        "excludedList"
    );

const excludeOption =
    document.getElementById(
        "excludeOption"
    );


/* =========================================================
   상태
========================================================= */

let excludedMaps = [];

let drawing = false;


/* =========================================================
   기본 랜덤
========================================================= */

function randomItem(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* =========================================================
   특정 맵 제외 랜덤
========================================================= */

function randomItemExcept(
    array,
    excludeIds = []
) {

    const candidates =
        array.filter(
            map =>
                !excludeIds.includes(
                    map.id
                )
        );


    if (
        candidates.length > 0
    ) {

        return randomItem(
            candidates
        );

    }


    return randomItem(
        array
    );

}


/* =========================================================
   카드 생성

   이미지 자체에 맵 이름이 있으므로
   별도 이름 영역은 만들지 않음
========================================================= */

function createCard(map) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "map-card";


    card.innerHTML = `

        <img
            src="${map.image}"
            alt="${map.name}"
            draggable="false"
        >

    `;


    return card;

}


/* =========================================================
   실제 추첨 가능한 맵
========================================================= */

function getAvailableMaps() {

    return maps.filter(
        map =>
            !excludedMaps.includes(
                map.id
            )
    );

}


/* =========================================================
   카드 중앙 정렬
========================================================= */

function centerCard(card) {

    if (!card) {
        return;
    }


    const cardCenter =
        card.offsetLeft +
        card.offsetWidth / 2;


    const containerCenter =
        rouletteWrap.clientWidth /
        2;


    const target =
        containerCenter -
        cardCenter;


    track.style.transform =
        `translateX(${target}px)`;

}


/* =========================================================
   초기 맵 미리보기
========================================================= */

function showInitialMaps() {

    const availableMaps =
        getAvailableMaps();


    track.innerHTML =
        "";


    track.style.transition =
        "none";


    availableMaps.forEach(
        map => {

            const card =
                createCard(
                    map
                );


            track.appendChild(
                card
            );

        }
    );


    if (
        availableMaps.length === 0
    ) {

        track.style.transform =
            "translateX(0px)";

        return;

    }


    requestAnimationFrame(
        () => {

            const cards =
                track.querySelectorAll(
                    ".map-card"
                );


            if (
                cards.length === 0
            ) {
                return;
            }


            const previewIndex =
                Math.floor(
                    cards.length /
                    2
                );


            centerCard(
                cards[
                    previewIndex
                ]
            );

        }
    );

}


/* =========================================================
   룰렛 연출 배열

   실제 당첨 후보와
   연출용 카드를 분리.

   실제 추첨:
       남은 맵에서만

   연출:
       전체 맵 사용
========================================================= */

function createRouletteSequence(
    winner
) {

    const rouletteMaps =
        [];


    /* =====================================================
       당첨 전 연출 카드
    ===================================================== */

    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const previous =
            rouletteMaps.length > 0
                ? rouletteMaps[
                    rouletteMaps.length - 1
                ]
                : null;


        const excludeIds =
            previous
                ? [
                    previous.id
                ]
                : [];


        const map =
            randomItemExcept(
                maps,
                excludeIds
            );


        rouletteMaps.push(
            map
        );

    }


    /* =====================================================
       당첨 바로 왼쪽 맵 보정

       왼쪽 ≠ 당첨
    ===================================================== */

    if (
        rouletteMaps.length > 0
    ) {

        const leftIndex =
            rouletteMaps.length -
            1;


        const leftMap =
            rouletteMaps[
                leftIndex
            ];


        if (
            leftMap.id ===
            winner.id
        ) {

            const beforeLeft =
                leftIndex > 0
                    ? rouletteMaps[
                        leftIndex - 1
                    ]
                    : null;


            const excludeIds =
                [
                    winner.id
                ];


            if (
                beforeLeft
            ) {

                excludeIds.push(
                    beforeLeft.id
                );

            }


            rouletteMaps[
                leftIndex
            ] =
                randomItemExcept(
                    maps,
                    excludeIds
                );

        }

    }


    /* =====================================================
       실제 당첨 카드
    ===================================================== */

    const winnerIndex =
        rouletteMaps.length;


    rouletteMaps.push(
        winner
    );


    /* =====================================================
       당첨 이후 카드

       오른쪽 ≠ 당첨
       연속 카드 중복 방지
    ===================================================== */

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const previous =
            rouletteMaps[
                rouletteMaps.length -
                1
            ];


        const map =
            randomItemExcept(
                maps,
                [
                    previous.id
                ]
            );


        rouletteMaps.push(
            map
        );

    }


    return {

        maps:
            rouletteMaps,

        winnerIndex:
            winnerIndex

    };

}


/* =========================================================
   맵 추첨
========================================================= */

function drawMap() {

    if (
        drawing
    ) {
        return;
    }


    const availableMaps =
        getAvailableMaps();


    /* =====================================================
       모든 맵 추첨 완료
    ===================================================== */

    if (
        availableMaps.length === 0
    ) {

        result.innerHTML =
            "모든 맵이 추첨되었습니다. 제외 맵을 초기화해주세요.";

        return;

    }


    drawing =
        true;


    drawBtn.disabled =
        true;


    resetBtn.disabled =
        true;


    result.innerHTML =
        "맵 추첨 중...";


    /* =====================================================
       실제 당첨 맵
    ===================================================== */

    const winner =
        randomItem(
            availableMaps
        );


    /* =====================================================
       연출용 배열
    ===================================================== */

    const roulette =
        createRouletteSequence(
            winner
        );


    const rouletteMaps =
        roulette.maps;


    const winnerIndex =
        roulette.winnerIndex;


    /* =====================================================
       트랙 초기화
    ===================================================== */

    track.innerHTML =
        "";


    track.style.transition =
        "none";


    track.style.transform =
        "translateX(0px)";


    /* =====================================================
       카드 생성
    ===================================================== */

    rouletteMaps.forEach(
        (map, index) => {

            const card =
                createCard(
                    map
                );


            if (
                index ===
                winnerIndex
            ) {

                card.dataset.winner =
                    "true";

            }


            track.appendChild(
                card
            );

        }
    );


    /* =====================================================
       룰렛 애니메이션
    ===================================================== */

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {


                    const cards =
                        track.querySelectorAll(
                            ".map-card"
                        );


                    const winnerCard =
                        cards[
                            winnerIndex
                        ];


                    const cardCenter =
                        winnerCard.offsetLeft +
                        winnerCard.offsetWidth /
                        2;


                    const containerCenter =
                        rouletteWrap.clientWidth /
                        2;


                    const startOffset =
                        Math.random() *
                        100;


                    track.style.transform =
                        `translateX(${startOffset}px)`;


                    requestAnimationFrame(
                        () => {


                            track.style.transition =
                                "transform 2.7s cubic-bezier(0.12, 0.72, 0.12, 1)";


                            const target =
                                containerCenter -
                                cardCenter;


                            track.style.transform =
                                `translateX(${target}px)`;

                        }
                    );

                }
            );

        }
    );


    /* =====================================================
       추첨 완료
    ===================================================== */

    setTimeout(
        () => {


            const winnerCard =
                track.querySelector(
                    '[data-winner="true"]'
                );


            if (
                winnerCard
            ) {

                winnerCard.classList.add(
                    "winner"
                );

            }


            /* =================================================
               결과
            ================================================= */

            result.innerHTML = `

                선택된 맵

                <span class="selected">
                    ${winner.name}
                </span>

            `;


            /* =================================================
               자동 제외
            ================================================= */

            if (
                excludeOption.checked
            ) {


                if (
                    !excludedMaps.includes(
                        winner.id
                    )
                ) {

                    excludedMaps.push(
                        winner.id
                    );

                }


                updateExcludedList();

            }


            drawing =
                false;


            drawBtn.disabled =
                false;


            resetBtn.disabled =
                false;


            /* =================================================
               남은 맵 수
            ================================================= */

            const remaining =
                maps.length -
                excludedMaps.length;


            if (
                excludeOption.checked
            ) {


                if (
                    remaining > 0
                ) {

                    result.innerHTML += `

                        <span class="remaining">
                            남은 맵 ${remaining}개
                        </span>

                    `;

                }

                else {

                    result.innerHTML += `

                        <span class="remaining">
                            모든 맵 추첨 완료
                        </span>

                    `;

                }

            }


        },
        2800
    );

}


/* =========================================================
   제외 맵 목록
========================================================= */

function updateExcludedList() {

    excludedList.innerHTML =
        "";


    if (
        excludedMaps.length === 0
    ) {

        excludedList.innerHTML = `

            <span class="empty">
                제외된 맵이 없습니다.
            </span>

        `;


        return;

    }


    excludedMaps.forEach(
        id => {


            const map =
                maps.find(
                    map =>
                        map.id === id
                );


            if (
                !map
            ) {
                return;
            }


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "excluded-item";


            item.textContent =
                map.name;


            excludedList.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   제외 맵 초기화
========================================================= */

function resetExcluded() {

    if (
        drawing
    ) {
        return;
    }


    excludedMaps =
        [];


    updateExcludedList();


    showInitialMaps();


    result.innerHTML =
        "제외된 맵이 초기화되었습니다.";

}


/* =========================================================
   화면 크기 변경 대응
========================================================= */

let resizeTimer;


window.addEventListener(
    "resize",
    () => {


        if (
            drawing
        ) {
            return;
        }


        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                showInitialMaps,
                150
            );

    }
);


/* =========================================================
   이벤트
========================================================= */

drawBtn.addEventListener(
    "click",
    drawMap
);


resetBtn.addEventListener(
    "click",
    resetExcluded
);


/* =========================================================
   최초 실행
========================================================= */

updateExcludedList();

showInitialMaps();

</script>

</body>
</html>
