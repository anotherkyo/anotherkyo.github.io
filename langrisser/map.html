<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>랑그릿사 모바일 맵 추첨</title>

<style>

/* =========================================================
   기본
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #263449 0%,
            #111720 42%,
            #090c11 100%
        );

    color: #eee;

    font-family:
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;
}


/* =========================================================
   전체 레이아웃
========================================================= */

.wrap {
    width: min(1200px, 96vw);

    margin: 18px auto 28px;

    text-align: center;
}


/* =========================================================
   대문
========================================================= */

.hero {
    position: relative;

    width: 100%;

    height: clamp(
        400px,
        32vh,
        460px
    );

    margin: 0 auto 18px;

    overflow: hidden;

    border:
        1px solid rgba(229, 198, 122, .35);

    border-radius: 10px;

    background: #111720;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, .35);
}

.hero img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position:
        center 38%;

    user-select: none;

    -webkit-user-drag:
        none;
}


/* =========================================================
   대문 제목
   이미지 기준 약 7시 방향
========================================================= */

.hero-title {
    position: absolute;

    z-index: 2;

    left: 5%;
    bottom: 10%;

    padding:
        10px 22px 11px;

    color:
        #f4d77d;

    font-size:
        26px;

    font-weight:
        800;

    letter-spacing:
        2px;

    white-space:
        nowrap;

    background:
        linear-gradient(
            90deg,
            rgba(8, 12, 18, .94) 0%,
            rgba(15, 21, 30, .84) 72%,
            rgba(15, 21, 30, .20) 100%
        );

    border-left:
        4px solid #e6c568;

    text-shadow:
        0 2px 5px rgba(0, 0, 0, .9);

    box-shadow:
        0 5px 18px rgba(0, 0, 0, .35);

    backdrop-filter:
        blur(2px);

    -webkit-backdrop-filter:
        blur(2px);
}


/* =========================================================
   공통 버튼
========================================================= */

button {
    padding:
        11px 22px;

    border:
        1px solid #92783d;

    border-radius:
        5px;

    background:
        linear-gradient(
            #3d3422,
            #211c13
        );

    color:
        #f1d78d;

    font-size:
        15px;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        background .2s,
        border-color .2s,
        transform .2s,
        opacity .2s;
}

button:hover:not(:disabled) {
    border-color:
        #e6c66c;

    background:
        linear-gradient(
            #504326,
            #2b2415
        );

    transform:
        translateY(-1px);
}

button:active:not(:disabled) {
    transform:
        translateY(0);
}

button:disabled {
    opacity:
        .4;

    cursor:
        default;
}


/* =========================================================
   사전 BAN 영역

   기본 상태에서는 접혀 있음
========================================================= */

.ban-box {
    width: 100%;

    margin:
        0 auto 16px;

    overflow: hidden;

    border:
        1px solid #303744;

    border-radius:
        7px;

    background:
        rgba(10, 14, 20, .58);

    box-shadow:
        0 5px 18px rgba(0, 0, 0, .2);
}


/* =========================================================
   BAN 헤더
========================================================= */

button.ban-toggle {
    width: 100%;

    min-height:
        48px;

    display: flex;

    align-items: center;

    gap:
        12px;

    padding:
        10px 15px;

    border: 0;

    border-radius: 0;

    background:
        linear-gradient(
            180deg,
            rgba(31, 38, 48, .92),
            rgba(17, 22, 29, .92)
        );

    color:
        #d8dde5;

    text-align:
        left;

    transform:
        none;
}

button.ban-toggle:hover:not(:disabled) {
    border: 0;

    background:
        linear-gradient(
            180deg,
            rgba(39, 47, 59, .95),
            rgba(20, 26, 34, .95)
        );

    transform:
        none;
}

.ban-toggle-title {
    display: flex;

    align-items: center;

    gap:
        7px;

    font-size:
        14px;

    font-weight:
        800;

    white-space:
        nowrap;
}

.ban-summary {
    margin-left:
        auto;

    color:
        #9ca5b2;

    font-size:
        12px;

    font-weight:
        600;
}

.ban-arrow {
    width:
        18px;

    color:
        #d6bd73;

    font-size:
        13px;

    text-align:
        center;
}


/* =========================================================
   BAN 펼침 영역
========================================================= */

.ban-panel {
    padding:
        14px;
}

.ban-panel[hidden] {
    display:
        none;
}


/* =========================================================
   BAN 안내
========================================================= */

.ban-toolbar {
    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        12px;

    margin-bottom:
        12px;

    color:
        #737e8c;

    font-size:
        12px;

    text-align:
        left;
}

.ban-help strong {
    color:
        #c9d0da;
}

.ban-limit {
    margin-top:
        3px;

    color:
        #5e6875;

    font-size:
        11px;
}


/* =========================================================
   BAN 초기화 버튼
========================================================= */

button.ban-reset-btn {
    flex:
        0 0 auto;

    padding:
        7px 11px;

    border:
        1px solid #5a4545;

    background:
        #211718;

    color:
        #c48c8c;

    font-size:
        11px;

    transform:
        none;
}

button.ban-reset-btn:hover:not(:disabled) {
    border-color:
        #9d5555;

    background:
        #301d1f;

    color:
        #eeaaaa;

    transform:
        none;
}


/* =========================================================
   BAN 이미지 목록

   PC : 4열 × 3행
========================================================= */

.ban-list {
    display:
        grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap:
        10px;
}


/* =========================================================
   BAN 맵 카드
========================================================= */

button.ban-map {
    position: relative;

    width: 100%;

    padding: 0;

    overflow: hidden;

    border:
        2px solid #414957;

    border-radius:
        6px;

    background:
        #151a21;

    box-shadow:
        0 4px 12px rgba(0, 0, 0, .28);

    transform:
        none;
}

button.ban-map:hover:not(:disabled) {
    border-color:
        #a18448;

    background:
        #151a21;

    transform:
        none;

    box-shadow:
        0 0 12px rgba(202, 166, 82, .2);
}

.ban-map img {
    display:
        block;

    width:
        100%;

    height:
        auto;

    aspect-ratio:
        550 / 290;

    object-fit:
        cover;

    user-select:
        none;

    -webkit-user-drag:
        none;

    transition:
        filter .2s,
        opacity .2s;
}


/* =========================================================
   BAN 상태 오버레이
========================================================= */

.ban-overlay {
    position:
        absolute;

    inset:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        8px;

    opacity:
        0;

    background:
        rgba(91, 10, 18, .68);

    color:
        #ffd0d0;

    font-size:
        20px;

    font-weight:
        900;

    letter-spacing:
        2px;

    transition:
        opacity .18s;

    pointer-events:
        none;
}

.ban-overlay .ban-x {
    font-size:
        24px;
}

button.ban-map.active {
    border-color:
        #d45858;

    box-shadow:
        0 0 12px rgba(213, 67, 67, .6),
        inset 0 0 20px rgba(128, 20, 20, .2);
}

button.ban-map.active img {
    filter:
        saturate(.45) brightness(.63);
}

button.ban-map.active .ban-overlay {
    opacity:
        1;
}


/* =========================================================
   룰렛 영역
========================================================= */

.roulette-wrap {
    position:
        relative;

    width:
        100%;

    overflow:
        hidden;

    padding:
        22px 0;

    border-top:
        1px solid #806c3d;

    border-bottom:
        1px solid #806c3d;

    background:
        rgba(0, 0, 0, .32);

    box-shadow:
        inset 0 0 40px rgba(0, 0, 0, .7),
        0 8px 30px rgba(0, 0, 0, .25);
}


/* =========================================================
   좌우 페이드
========================================================= */

.roulette-wrap::before,
.roulette-wrap::after {
    content: "";

    position:
        absolute;

    z-index:
        5;

    top:
        0;

    width:
        12%;

    height:
        100%;

    pointer-events:
        none;
}

.roulette-wrap::before {
    left:
        0;

    background:
        linear-gradient(
            90deg,
            #090c11 0%,
            rgba(9, 12, 17, .85) 25%,
            transparent 100%
        );
}

.roulette-wrap::after {
    right:
        0;

    background:
        linear-gradient(
            -90deg,
            #090c11 0%,
            rgba(9, 12, 17, .85) 25%,
            transparent 100%
        );
}


/* =========================================================
   룰렛 트랙
========================================================= */

.roulette-track {
    display:
        flex;

    gap:
        18px;

    width:
        max-content;

    transform:
        translateX(0);

    will-change:
        transform;
}


/* =========================================================
   실제 룰렛 맵 카드

   이미지 자체에 이름이 들어 있으므로
   별도 맵 이름 영역 없음
========================================================= */

.map-card {
    position:
        relative;

    flex:
        0 0 550px;

    width:
        550px;

    height:
        290px;

    overflow:
        hidden;

    background:
        #171d25;

    border:
        2px solid #414957;

    border-radius:
        8px;

    box-shadow:
        0 6px 18px rgba(0, 0, 0, .4);

    transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s,
        opacity .25s;
}

.map-card img {
    display:
        block;

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;

    user-select:
        none;

    -webkit-user-drag:
        none;
}


/* =========================================================
   당첨 맵
========================================================= */

.map-card.winner {
    z-index:
        2;

    border-color:
        #f1d278;

    box-shadow:
        0 0 12px rgba(241, 210, 120, .85),
        0 0 35px rgba(241, 210, 120, .45);

    transform:
        scale(1.025);
}


/* =========================================================
   중앙 선택 영역
========================================================= */

.selector {
    position:
        absolute;

    z-index:
        10;

    left:
        50%;

    top:
        12px;

    bottom:
        12px;

    width:
        554px;

    transform:
        translateX(-50%);

    border-left:
        2px solid #e7c467;

    border-right:
        2px solid #e7c467;

    pointer-events:
        none;
}

.selector::before,
.selector::after {
    position:
        absolute;

    left:
        50%;

    transform:
        translateX(-50%);

    color:
        #ffd875;

    font-size:
        24px;

    line-height:
        1;

    text-shadow:
        0 0 8px #e3af38;
}

.selector::before {
    content:
        "▼";

    top:
        -18px;
}

.selector::after {
    content:
        "▲";

    bottom:
        -18px;
}


/* =========================================================
   결과
========================================================= */

.result {
    min-height:
        50px;

    margin-top:
        14px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    flex-wrap:
        wrap;

    font-size:
        20px;

    font-weight:
        700;
}

.result .selected {
    margin-left:
        8px;

    color:
        #f1ce70;

    font-size:
        24px;
}

.remaining {
    margin-left:
        12px;

    color:
        #737d8a;

    font-size:
        13px;
}


/* =========================================================
   추첨 버튼
========================================================= */

.controls {
    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    flex-wrap:
        wrap;

    gap:
        10px;

    margin-top:
        8px;
}

.draw-btn {
    min-width:
        180px;

    padding:
        12px 30px;

    font-size:
        17px;
}


/* =========================================================
   자동 제외 옵션
========================================================= */

.option {
    margin-top:
        14px;

    color:
        #bfc5ce;

    font-size:
        14px;
}

.option label {
    cursor:
        pointer;
}

.option input {
    vertical-align:
        -1px;
}


/* =========================================================
   추첨 완료 제외 목록
========================================================= */

.excluded-box {
    max-width:
        900px;

    margin:
        22px auto 0;

    padding-top:
        14px;

    border-top:
        1px solid #303744;
}

.excluded-title {
    margin-bottom:
        10px;

    color:
        #828b98;

    font-size:
        14px;
}

.excluded-list {
    min-height:
        30px;

    display:
        flex;

    justify-content:
        center;

    flex-wrap:
        wrap;

    gap:
        7px;
}

.excluded-item {
    padding:
        5px 10px;

    border:
        1px solid #3d4551;

    border-radius:
        4px;

    background:
        #151a21;

    color:
        #89919c;

    font-size:
        12px;
}

.empty {
    color:
        #59616d;

    font-size:
        13px;
}


/* =========================================================
   1080p급 PC
========================================================= */

@media (max-height: 1100px) and (min-width: 701px) {

    .wrap {
        margin-top:
            12px;
    }

    .hero {
        height:
            clamp(
                400px,
                38vh,
                430px
            );

        margin-bottom:
            14px;
    }

    .ban-box {
        margin-bottom:
            12px;
    }

    .roulette-wrap {
        padding:
            18px 0;
    }

    .result {
        min-height:
            44px;

        margin-top:
            10px;
    }

    .controls {
        margin-top:
            5px;
    }

    .option {
        margin-top:
            10px;
    }

    .excluded-box {
        margin-top:
            16px;

        padding-top:
            10px;
    }

}


/* =========================================================
   태블릿 / 모바일
========================================================= */

@media (max-width: 700px) {

    .wrap {
        width:
            96vw;

        margin:
            14px auto 25px;
    }


    /* 대문 */

    .hero {
        height:
            clamp(
                190px,
                42vw,
                280px
            );

        margin-bottom:
            14px;

        border-radius:
            7px;
    }

    .hero img {
        object-position:
            center 38%;
    }

    .hero-title {
        left:
            4%;

        bottom:
            8%;

        padding:
            7px 14px 8px;

        border-left-width:
            3px;

        font-size:
            18px;

        letter-spacing:
            1px;
    }


    /* BAN */

    .ban-list {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .ban-toolbar {
        align-items:
            flex-start;
    }

    .ban-summary {
        font-size:
            11px;
    }


    /* 룰렛 */

    .roulette-wrap {
        padding:
            20px 0;
    }

    .map-card {
        flex-basis:
            82vw;

        width:
            82vw;

        height:
            auto;

        aspect-ratio:
            550 / 290;
    }

    .selector {
        top:
            10px;

        bottom:
            10px;

        width:
            calc(82vw + 4px);
    }


    /* 결과 */

    .result {
        min-height:
            45px;

        margin-top:
            12px;

        font-size:
            17px;
    }

    .result .selected {
        font-size:
            21px;
    }

}


/* =========================================================
   작은 모바일
========================================================= */

@media (max-width: 420px) {

    .hero {
        height:
            180px;
    }

    .hero-title {
        left:
            4%;

        bottom:
            7%;

        padding:
            6px 11px;

        font-size:
            15px;

        letter-spacing:
            .7px;
    }

    .ban-toggle-title {
        font-size:
            12px;
    }

    .ban-summary {
        font-size:
            10px;
    }

    .ban-panel {
        padding:
            10px;
    }

    .ban-list {
        gap:
            7px;
    }

    .ban-overlay {
        font-size:
            16px;
    }

    .map-card {
        flex-basis:
            86vw;

        width:
            86vw;
    }

    .selector {
        width:
            calc(86vw + 4px);
    }

    .controls {
        gap:
            8px;
    }

    .draw-btn {
        min-width:
            155px;

        font-size:
            15px;
    }

    button {
        padding:
            10px 14px;

        font-size:
            13px;
    }

    .result {
        font-size:
            15px;
    }

    .result .selected {
        font-size:
            19px;
    }

}

</style>
</head>


<body>

<div class="wrap">


    <!-- =====================================================
         대문
    ====================================================== -->

    <div class="hero">

        <img
            src="https://anotherkyo.github.io/img/map.png"
            alt="랑그릿사 모바일 맵 추첨"
            draggable="false"
        >

        <div class="hero-title">
            Langrisser Map Select
        </div>

    </div>


    <!-- =====================================================
         사전 BAN
    ====================================================== -->

    <div class="ban-box">

        <button
            type="button"
            class="ban-toggle"
            id="banToggleBtn"
            aria-expanded="false"
        >

            <span class="ban-toggle-title">
                🚫 사전 BAN 설정
            </span>

            <span
                class="ban-summary"
                id="banSummary"
            >
                BAN 0개 / 추첨 가능 12개
            </span>

            <span
                class="ban-arrow"
                id="banArrow"
            >
                ▼
            </span>

        </button>


        <div
            class="ban-panel"
            id="banPanel"
            hidden
        >

            <div class="ban-toolbar">

                <div class="ban-help">

                    <strong>
                        추첨에서 제외할 맵이 있다면 이미지를 선택해주세요.
                    </strong>

                    <div
                        class="ban-limit"
                        id="banLimit"
                    ></div>

                </div>


                <button
                    type="button"
                    class="ban-reset-btn"
                    id="banResetBtn"
                >
                    BAN 초기화
                </button>

            </div>


            <div
                class="ban-list"
                id="banList"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         룰렛
    ====================================================== -->

    <div
        class="roulette-wrap"
        id="rouletteWrap"
    >

        <div class="selector"></div>

        <div
            class="roulette-track"
            id="rouletteTrack"
        ></div>

    </div>


    <!-- =====================================================
         결과
    ====================================================== -->

    <div
        class="result"
        id="result"
    >
        맵 추첨을 시작해주세요.
    </div>


    <!-- =====================================================
         버튼
    ====================================================== -->

    <div class="controls">

        <button
            class="draw-btn"
            id="drawBtn"
        >
            🎲 맵 추첨
        </button>

        <button
            id="resetBtn"
        >
            제외 맵 초기화
        </button>

    </div>


    <!-- =====================================================
         추첨 완료 자동 제외
    ====================================================== -->

    <div class="option">

        <label>

            <input
                type="checkbox"
                id="excludeOption"
                checked
            >

            추첨된 맵은 다음 추첨에서 제외

        </label>

    </div>


    <!-- =====================================================
         추첨 완료 제외 목록
    ====================================================== -->

    <div class="excluded-box">

        <div class="excluded-title">
            추첨 후 제외된 맵
        </div>

        <div
            class="excluded-list"
            id="excludedList"
        ></div>

    </div>

</div>


<script>

/* =========================================================
   맵 데이터

   name은 룰렛 카드 아래에는 표시하지 않음.

   하지만
   - 추첨 결과
   - BAN 처리
   - 제외 목록
   - alt

   에서 사용.
========================================================= */

const maps = [

    {
        id: "map01",
        name: "서풍초소",
        image: "./img/map/01.png"
    },

    {
        id: "map02",
        name: "사막의 눈",
        image: "./img/map/02.png"
    },

    {
        id: "map03",
        name: "하늘정원",
        image: "./img/map/03.png"
    },

    {
        id: "map04",

/* =========================================================
   BAN 최대 개수

   마지막 정지 화면에서

   왼쪽 / 당첨 / 오른쪽

   3개를 서로 다른 맵으로 만들기 위해
   최소 3개의 non-BAN 맵을 유지.

   12개 맵 기준 최대 BAN = 9개
========================================================= */

const MAX_BAN =
    Math.max(
        0,
        maps.length - 3
    );


/* =========================================================
   DOM
========================================================= */

const track =
    document.getElementById(
        "rouletteTrack"
    );

const rouletteWrap =
    document.getElementById(
        "rouletteWrap"
    );

const drawBtn =
    document.getElementById(
        "drawBtn"
    );

const resetBtn =
    document.getElementById(
        "resetBtn"
    );

const result =
    document.getElementById(
        "result"
    );

const excludedList =
    document.getElementById(
        "excludedList"
    );

const excludeOption =
    document.getElementById(
        "excludeOption"
    );


/* BAN */

const banToggleBtn =
    document.getElementById(
        "banToggleBtn"
    );

const banPanel =
    document.getElementById(
        "banPanel"
    );

const banArrow =
    document.getElementById(
        "banArrow"
    );

const banSummary =
    document.getElementById(
        "banSummary"
    );

const banList =
    document.getElementById(
        "banList"
    );

const banResetBtn =
    document.getElementById(
        "banResetBtn"
    );

const banLimit =
    document.getElementById(
        "banLimit"
    );


/* =========================================================
   상태

   bannedMaps
       = 사용자가 사전에 직접 BAN

   excludedMaps
       = 실제 추첨 후 자동 제외
========================================================= */

let bannedMaps = [];

let excludedMaps = [];

let drawing = false;


/* =========================================================
   기본 랜덤
========================================================= */

function randomItem(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* =========================================================
   특정 맵들을 제외한 랜덤
========================================================= */

function randomItemExcept(
    array,
    excludeIds = []
) {

    const candidates =
        array.filter(
            map =>
                !excludeIds.includes(
                    map.id
                )
        );


    if (
        candidates.length > 0
    ) {

        return randomItem(
            candidates
        );

    }


    return randomItem(
        array
    );

}


/* =========================================================
   실제 당첨 가능한 맵

   BAN 제외
   +
   추첨 완료 제외
========================================================= */

function getAvailableMaps() {

    return maps.filter(
        map =>
            !bannedMaps.includes(
                map.id
            )
            &&
            !excludedMaps.includes(
                map.id
            )
    );

}


/* =========================================================
   룰렛 연출용 맵

   BAN된 맵만 제외.

   이미 추첨된 맵은 화면 연출에서는
   다시 지나갈 수 있음.

   하지만 실제 당첨 후보에는 들어가지 않음.
========================================================= */

function getRoulettePool() {

    return maps.filter(
        map =>
            !bannedMaps.includes(
                map.id
            )
    );

}


/* =========================================================
   룰렛 맵 카드 생성
========================================================= */

function createCard(map) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "map-card";


    card.innerHTML = `

        <img
            src="${map.image}"
            alt="${map.name}"
            draggable="false"
        >

    `;


    return card;

}


/* =========================================================
   카드 중앙 정렬
========================================================= */

function centerCard(card) {

    if (!card) {
        return;
    }


    const cardCenter =
        card.offsetLeft +
        card.offsetWidth / 2;


    const containerCenter =
        rouletteWrap.clientWidth /
        2;


    const target =
        containerCenter -
        cardCenter;


    track.style.transform =
        `translateX(${target}px)`;

}


/* =========================================================
   초기 / 변경 후 맵 미리보기

   BAN 및 추첨 완료 맵은 표시하지 않음.
========================================================= */

function showInitialMaps() {

    if (drawing) {
        return;
    }


    const availableMaps =
        getAvailableMaps();


    track.innerHTML =
        "";


    track.style.transition =
        "none";


    availableMaps.forEach(
        map => {

            track.appendChild(
                createCard(map)
            );

        }
    );


    if (
        availableMaps.length === 0
    ) {

        track.style.transform =
            "translateX(0px)";

        return;

    }


    requestAnimationFrame(
        () => {

            const cards =
                track.querySelectorAll(
                    ".map-card"
                );


            if (
                cards.length === 0
            ) {

                return;

            }


            const previewIndex =
                Math.floor(
                    cards.length / 2
                );


            centerCard(
                cards[
                    previewIndex
                ]
            );

        }
    );

}


/* =========================================================
   BAN 패널 접기 / 펼치기
========================================================= */

function toggleBanPanel() {

    const isOpen =
        !banPanel.hidden;


    banPanel.hidden =
        isOpen;


    banToggleBtn.setAttribute(
        "aria-expanded",
        String(!isOpen)
    );


    banArrow.textContent =
        isOpen
            ? "▼"
            : "▲";

}


/* =========================================================
   BAN 요약 갱신
========================================================= */

function updateBanSummary() {

    const availableCount =
        getAvailableMaps().length;


    banSummary.textContent =
        `BAN ${bannedMaps.length}개 / 추첨 가능 ${availableCount}개`;


    banLimit.textContent =
        `BAN은 선택 사항이며 0~${MAX_BAN}개까지 설정할 수 있습니다.`;


    banResetBtn.disabled =
        bannedMaps.length === 0;

}


/* =========================================================
   BAN 목록 렌더링
========================================================= */

function renderBanList() {

    banList.innerHTML =
        "";


    maps.forEach(
        map => {


            const item =
                document.createElement(
                    "button"
                );


            item.type =
                "button";


            item.className =
                "ban-map";


            /*
               접근성용 설명
            */

            item.setAttribute(
                "aria-label",
                `${map.name} BAN 설정`
            );


            if (
                bannedMaps.includes(
                    map.id
                )
            ) {

                item.classList.add(
                    "active"
                );

            }


            item.innerHTML = `

                <img
                    src="${map.image}"
                    alt="${map.name}"
                    draggable="false"
                >

                <div class="ban-overlay">

                    <span>
                        BAN
                    </span>

                    <span class="ban-x">
                        ✕
                    </span>

                </div>

            `;


            item.addEventListener(
                "click",
                () => {

                    toggleBan(
                        map.id
                    );

                }
            );


            banList.appendChild(
                item
            );

        }
    );


    updateBanSummary();

}


/* =========================================================
   BAN 선택 / 해제
========================================================= */

function toggleBan(mapId) {

    if (drawing) {
        return;
    }


    /* =====================================================
       이미 BAN 상태라면 해제
    ===================================================== */

    if (
        bannedMaps.includes(
            mapId
        )
    ) {

        bannedMaps =
            bannedMaps.filter(
                id =>
                    id !== mapId
            );

    }


    /* =====================================================
       BAN 추가
    ===================================================== */

    else {

        if (
            bannedMaps.length >=
            MAX_BAN
        ) {

            result.innerHTML =
                `BAN은 최대 ${MAX_BAN}개까지 설정할 수 있습니다.`;

            return;

        }


        bannedMaps.push(
            mapId
        );

    }


    renderBanList();

    showInitialMaps();

}


/* =========================================================
   BAN 초기화

   추첨 후 제외 기록은 건드리지 않음.
========================================================= */

function resetBans() {

    if (drawing) {
        return;
    }


    bannedMaps =
        [];


    renderBanList();

    showInitialMaps();


    result.innerHTML =
        "사전 BAN 설정이 초기화되었습니다.";

}


/* =========================================================
   룰렛 연출 배열 생성

   중요

   최종 정지 화면

       [왼쪽] [당첨] [오른쪽]

   이 3개의 맵이 모두 서로 다르게 구성됨.
========================================================= */

function createRouletteSequence(
    winner
) {

    const sequence =
        [];


    const roulettePool =
        getRoulettePool();


    /* =====================================================
       당첨 전 연출 카드 30개

       바로 앞 카드와 같은 맵은 금지.
    ===================================================== */

    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const previous =
            sequence.length > 0
                ? sequence[
                    sequence.length - 1
                ]
                : null;


        const excludeIds =
            previous
                ? [previous.id]
                : [];


        const map =
            randomItemExcept(
                roulettePool,
                excludeIds
            );


        sequence.push(
            map
        );

    }


    /* =====================================================
       당첨 바로 왼쪽 카드

       당첨 맵과 같으면 교체.

       또한 왼쪽의 왼쪽과도 중복되지 않게 처리.
    ===================================================== */

    if (
        sequence.length > 0
    ) {

        const leftIndex =
            sequence.length - 1;


        const leftMap =
            sequence[
                leftIndex
            ];


        if (
            leftMap.id ===
            winner.id
        ) {

            const beforeLeft =
                leftIndex > 0
                    ? sequence[
                        leftIndex - 1
                    ]
                    : null;


            const excludeIds =
                [
                    winner.id
                ];


            if (
                beforeLeft
            ) {

                excludeIds.push(
                    beforeLeft.id
                );

            }


            sequence[
                leftIndex
            ] =
                randomItemExcept(
                    roulettePool,
                    excludeIds
                );

        }

    }


    /* =====================================================
       실제 당첨 위치
    ===================================================== */

    const winnerIndex =
        sequence.length;


    sequence.push(
        winner
    );


    /* =====================================================
       당첨 이후 카드 4개
    ===================================================== */

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const previous =
            sequence[
                sequence.length - 1
            ];


        const excludeIds =
            [
                previous.id
            ];


        /*
           첫 번째 오른쪽 카드의 경우

           당첨 맵뿐 아니라
           당첨 왼쪽 맵도 함께 제외.

           따라서 최종 화면은

           왼쪽 ≠ 당첨 ≠ 오른쪽
           왼쪽 ≠ 오른쪽

           모두 만족.
        */

        if (
            i === 0
            &&
            winnerIndex > 0
        ) {

            const leftMap =
                sequence[
                    winnerIndex - 1
                ];


            excludeIds.push(
                leftMap.id
            );

        }


        const map =
            randomItemExcept(
                roulettePool,
                excludeIds
            );


        sequence.push(
            map
        );

    }


    return {

        maps:
            sequence,

        winnerIndex:
            winnerIndex

    };

}


/* =========================================================
   맵 추첨
========================================================= */

function drawMap() {

    if (drawing) {
        return;
    }


    const availableMaps =
        getAvailableMaps();


    /* =====================================================
       BAN 0개도 정상 추첨 가능.

       실제 추첨 가능한 맵이 없는 경우에만 차단.
    ===================================================== */

    if (
        availableMaps.length === 0
    ) {

        result.innerHTML =
            "추첨 가능한 맵이 없습니다. BAN 또는 제외 맵을 조정해주세요.";

        return;

    }


    drawing =
        true;


    drawBtn.disabled =
        true;


    resetBtn.disabled =
        true;


    banResetBtn.disabled =
        true;


    result.innerHTML =
        "맵 추첨 중...";


    /* =====================================================
       실제 당첨 맵

       BAN 및 추첨 완료 제외가 적용된
       availableMaps 에서만 선택.
    ===================================================== */

    const winner =
        randomItem(
            availableMaps
        );


    /* =====================================================
       룰렛 연출 배열
    ===================================================== */

    const roulette =
        createRouletteSequence(
            winner
        );


    const rouletteMaps =
        roulette.maps;


    const winnerIndex =
        roulette.winnerIndex;


    /* =====================================================
       트랙 초기화
    ===================================================== */

    track.innerHTML =
        "";


    track.style.transition =
        "none";


    track.style.transform =
        "translateX(0px)";


    /* =====================================================
       연출 카드 생성
    ===================================================== */

    rouletteMaps.forEach(
        (map, index) => {


            const card =
                createCard(
                    map
                );


            if (
                index ===
                winnerIndex
            ) {

                card.dataset.winner =
                    "true";

            }


            track.appendChild(
                card
            );

        }
    );


    /* =====================================================
       룰렛 이동
    ===================================================== */

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {


                    const cards =
                        track.querySelectorAll(
                            ".map-card"
                        );


                    const winnerCard =
                        cards[
                            winnerIndex
                        ];


                    const cardCenter =
                        winnerCard.offsetLeft
                        +
                        winnerCard.offsetWidth / 2;


                    const containerCenter =
                        rouletteWrap.clientWidth
                        /
                        2;


                    const startOffset =
                        Math.random() * 100;


                    track.style.transform =
                        `translateX(${startOffset}px)`;


                    requestAnimationFrame(
                        () => {


                            track.style.transition =
                                "transform 2.7s cubic-bezier(0.12, 0.72, 0.12, 1)";


                            const target =
                                containerCenter
                                -
                                cardCenter;


                            track.style.transform =
                                `translateX(${target}px)`;

                        }
                    );

                }
            );

        }
    );


    /* =====================================================
       추첨 완료
    ===================================================== */

    setTimeout(
        () => {


            const winnerCard =
                track.querySelector(
                    '[data-winner="true"]'
                );


            if (
                winnerCard
            ) {

                winnerCard.classList.add(
                    "winner"
                );

            }


            /* =================================================
               결과 표시
            ================================================= */

            result.innerHTML = `

                선택된 맵

                <span class="selected">
                    ${winner.name}
                </span>

            `;


            /* =================================================
               추첨 후 자동 제외
            ================================================= */

            if (
                excludeOption.checked
            ) {


                if (
                    !excludedMaps.includes(
                        winner.id
                    )
                ) {

                    excludedMaps.push(
                        winner.id
                    );

                }


                updateExcludedList();

            }


            /* =================================================
               상태 복구
            ================================================= */

            drawing =
                false;


            drawBtn.disabled =
                false;


            resetBtn.disabled =
                false;


            updateBanSummary();


            /* =================================================
               현재 실제 추첨 가능 맵 수
            ================================================= */

            const remaining =
                getAvailableMaps().length;


            result.innerHTML += `

                <span class="remaining">
                    추첨 가능 ${remaining}개
                </span>

            `;


        },
        2800
    );

}


/* =========================================================
   추첨 후 제외된 맵 목록
========================================================= */

function updateExcludedList() {

    excludedList.innerHTML =
        "";


    if (
        excludedMaps.length === 0
    ) {

        excludedList.innerHTML = `

            <span class="empty">
                제외된 맵이 없습니다.
            </span>

        `;


        updateBanSummary();

        return;

    }


    excludedMaps.forEach(
        id => {


            const map =
                maps.find(
                    map =>
                        map.id === id
                );


            if (
                !map
            ) {

                return;

            }


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "excluded-item";


            item.textContent =
                map.name;


            excludedList.appendChild(
                item
            );

        }
    );


    updateBanSummary();

}


/* =========================================================
   추첨 후 제외 목록 초기화

   사전 BAN 설정은 유지.
========================================================= */

function resetExcluded() {

    if (drawing) {
        return;
    }


    excludedMaps =
        [];


    updateExcludedList();


    showInitialMaps();


    result.innerHTML =
        "추첨 후 제외된 맵이 초기화되었습니다. 사전 BAN 설정은 유지됩니다.";

}


/* =========================================================
   화면 크기 변경
========================================================= */

let resizeTimer;


window.addEventListener(
    "resize",
    () => {


        if (
            drawing
        ) {

            return;

        }


        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                showInitialMaps,
                150
            );

    }
);


/* =========================================================
   이벤트
========================================================= */

drawBtn.addEventListener(
    "click",
    drawMap
);


resetBtn.addEventListener(
    "click",
    resetExcluded
);


banToggleBtn.addEventListener(
    "click",
    toggleBanPanel
);


banResetBtn.addEventListener(
    "click",
    resetBans
);


/* =========================================================
   최초 실행
========================================================= */

renderBanList();

updateExcludedList();

showInitialMaps();

</script>
